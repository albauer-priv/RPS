services:
  rps:
    image: ghcr.io/albauer-priv/rps:latest
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./runtime:/app/runtime
      # Uncomment the two lines below and set RPS_USERS_FILE to enable opt-in auth:
      # - ./config:/app/config:ro
    environment:
      # RPS_USERS_FILE: /app/config/users.yaml
      {}
    restart: unless-stopped
