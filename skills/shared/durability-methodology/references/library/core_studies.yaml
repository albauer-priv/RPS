    core_concepts:
    - Carbohydrate intake during ultraendurance exercise.
    - Internal exercise load and perceived exertion.
    - Exercise-induced muscle-damage biomarkers.
    - Prior nutritional and gut training.
    - Mountain-marathon context.
    key_takeaways:
