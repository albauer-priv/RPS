- id: dur_core_028
  source_kind: core
  authors: Mujika, I., & Padilla, S.
  year: 2000
  title: 'Detraining: loss of training-induced physiological and performance adaptations.
    Part II: long term insufficient training stimulus'
  journal_or_outlet: Sports Medicine
  source_type: peer_reviewed
  study_type: narrative_review
  reference_locator: https://pubmed.ncbi.nlm.nih.gov/10999420/
  verification_status: verified
  locator_source: pubmed
  topic_tags:
  - detraining
  - recovery
  - performance_decay
  - long_term_adaptation
  question_or_focus: Long-term insufficient training stimulus, detraining, associated
    physiological and performance losses, and strategies that may limit those losses.
  population_or_scope: Athletes undergoing an insufficient training stimulus for longer
    than 4 weeks, including endurance athletes and strength athletes as described
    in the review abstract; the abstract also refers to highly trained and moderately
    trained individuals.
  what_was_examined:
  - The review abstract examines physiological and performance changes associated
    with more than 4 weeks of insufficient training stimulus, including maximal oxygen
    uptake, cardiovascular and ventilatory characteristics, endurance performance,
    muscle glycogen and carbohydrate utilisation, lactate threshold, muscle-level
    adaptations, muscle fibre characteristics, and force production.
  - It also describes reduced-training and cross-training strategies that may limit
    detraining effects.
  core_concepts:
  - Long-term insufficient training stimulus
  - Detraining
  - Loss and preservation of training-induced physiological adaptations
  - Training intensity, frequency, and volume during reduced training
  - Cross-training and similar-mode exercise
  important_findings:
  - The review abstract reports that, after more than 4 weeks of insufficient training
    stimulus, athletes’ maximal oxygen uptake declines markedly but remains above
    control values, while recently acquired maximal oxygen uptake gains may be completely
    lost.
  - The abstract reports reductions in blood volume, cardiac dimensions, ventilatory
    efficiency, stroke volume, and cardiac output, with increased heart rates and
    impaired endurance performance during long-term detraining.
  - The abstract reports that resting muscle glycogen returns to baseline, carbohydrate
    utilisation increases, and lactate threshold is lowered, although some values
    remain above those of untrained individuals in highly trained athletes.
  - The abstract reports declines in capillarisation, arterial-venous oxygen difference,
    and oxidative enzyme activities; these adaptations are described as completely
    reversed in recently trained individuals.
  - The abstract reports that force production declines slowly and usually remains
    above control values for very long periods.
  - The abstract states that negative effects can be avoided or limited by reduced-training
    strategies when training intensity is maintained, frequency is reduced only moderately,
    and training volume is markedly reduced.
  - The abstract reports that cross-training may help maintain training-induced adaptations,
    with similar-mode exercise suggested for athletes and dissimilar-mode cross-training
    potentially beneficial for moderately trained individuals.
  practical_implications:
  - For long-duration planning, the abstract supports treating prolonged insufficient
    training as a potential threat to retained aerobic and endurance-performance adaptations
    rather than assuming that all adaptations decay at the same rate.
  - When discussing reduced-training periods, RPS can cite the abstract’s review-level
    indication that maintaining intensity, reducing volume substantially, and limiting
    frequency reduction may help preserve adaptations; this is not a direct individualized
    coaching prescription.
  - For athlete education, the source can explain why performance may decline during
    extended undertraining and why recently acquired adaptations may be particularly
    vulnerable.
  - Cross-training can be discussed as an abstract-supported option for maintaining
    adaptations, while acknowledging that the available material does not establish
    a specific modality or workload for an individual athlete.
  key_takeaways:
  - The review abstract describes long-term detraining as a source of both physiological
    and endurance-performance decline after an insufficient training stimulus lasting
    longer than 4 weeks.
  - 'The abstract indicates that the extent and speed of adaptation loss differ by
    adaptation: recently acquired aerobic adaptations may be lost completely, whereas
    some strength-related capacity may persist longer.'
  - The abstract-supported preservation strategy is characterized by maintaining training
    intensity while reducing volume substantially and frequency only moderately; this
    should be treated as review-level guidance rather than an individualized prescription.
  what_this_does_not_justify:
  - It does not justify a precise taper, deload, or return-to-training prescription
    for an individual athlete.
  - It does not justify assuming that maintaining intensity and reducing volume will
    produce the same result across athletes, training histories, event types, or health
    states.
  - It does not justify sport-specific conclusions for cycling, brevet, or ultra-endurance
    performance beyond cautious conceptual transfer.
  - It does not justify claims about pacing stability, fatigue resistance during long
    events, fueling requirements, masters athletes, or recovery needs that are not
    stated in the abstract.
  - It does not justify treating the reported physiological changes as evidence from
    a single controlled intervention or as a quantified dose-response relationship.
  important_limits:
  - The available source material is abstract-level only; the review’s full methods,
    evidence selection, study characteristics, and detailed support for each strategy
    cannot be assessed here.
  - The abstract does not provide athlete-level thresholds for how much volume or
    frequency to retain, nor does it establish a specific duration, workload, or progression
    for reduced training.
  - The abstract concerns long-term insufficient training stimulus and detraining,
    not the full range of tapering, recovery, fatigue-management, or race-preparation
    contexts.
  - The abstract does not directly examine cycling, brevet, ultra-endurance, masters
    athletes, pacing stability, durability under repeated fatigue, or low-metabolic-strain
    performance.
  - Cross-training findings and transfer claims are reported in the abstract but are
    not sufficiently detailed here to determine modality-specific equivalence or individualized
    applicability.
