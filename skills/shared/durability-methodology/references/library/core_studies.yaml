- id: dur_core_026
  source_kind: core
  authors: Coyle, E. F., Hemmert, M. K., & Coggan, A. R.
  year: 1986
  title: 'Effects of detraining on cardiovascular responses to exercise: role of blood
    volume'
  journal_or_outlet: Journal of Applied Physiology
  source_type: peer_reviewed
  study_type: other
  reference_locator: https://pubmed.ncbi.nlm.nih.gov/3944049/
  verification_status: verified
  locator_source: pubmed
  topic_tags:
  - detraining
  - blood_volume
  - cardiovascular_response
  - endurance
  question_or_focus: Whether the decline in exercise stroke volume after 2–4 weeks
    of detraining in endurance-trained men is associated with reduced blood volume,
    and whether cardiovascular function can be restored by expanding blood volume.
  population_or_scope: Eight endurance-trained men studied before and after 2–4 weeks
    of inactivity. Cardiovascular responses were assessed during upright cycling at
    50–60% VO2max; blood-volume expansion was then performed with a 6% dextran solution
    in saline.
  what_was_examined:
  - Blood volume and plasma volume before and after 2–4 weeks of detraining.
  - Stroke volume, VO2max, heart rate, and total peripheral resistance during upright
    submaximal cycling.
  - Whether expanding blood volume in the detrained state restored cardiovascular
    responses toward trained-state values.
  core_concepts:
  - Detraining
  - Blood volume and plasma volume
  - Stroke volume
  - VO2max
  - Cardiovascular responses during upright exercise
  - Ventricular filling
  important_findings:
  - Blood volume declined by 9%, from 5,177 to 4,692 ml, during upright exercise after
    detraining.
  - Plasma volume declined by 12%.
  - Stroke volume declined by 12% and VO2max declined by 6%.
  - Heart rate during submaximal exercise increased by 11%, and total peripheral resistance
    increased by 8%.
  - After blood volume was expanded to approximately 5,500 ± 200 ml, stroke volume
    and VO2max in the detrained state increased to within 2–4% of trained values.
  - Heart rate and total peripheral resistance during submaximal exercise were lowered
    to near trained values after volume expansion.
  practical_implications:
  - For RPS, the abstract provides a physiological rationale for treating short periods
    of detraining as potentially relevant to cardiovascular exercise responses, rather
    than assuming that all changes reflect loss of muscular capacity alone.
  - The abstract-supported implication is that reduced blood volume and associated
    ventricular filling may contribute to altered submaximal exercise responses after
    a few weeks of inactivity.
  - This source may support cautious explanation of why maintaining training continuity
    can matter for endurance-related cardiovascular function, but it does not establish
    a specific training, re-entry, hydration, or recovery prescription.
  key_takeaways:
  - The abstract reports that 2–4 weeks of inactivity reduced blood volume and plasma
    volume in endurance-trained men.
  - The abstract reports concurrent reductions in stroke volume and VO2max, with increased
    heart rate and total peripheral resistance during submaximal upright cycling.
  - The abstract reports that dextran-based plasma-volume expansion reversed these
    cardiovascular changes toward trained-state values.
  - The findings indicate that reduced blood volume appears to limit ventricular filling
    during upright exercise after a few weeks of detraining.
  what_this_does_not_justify:
  - It does not justify a specific detraining duration at which performance or durability
    will decline for cycling, brevet, or ultra athletes.
  - It does not directly examine prolonged exercise, fatigue resistance, pacing stability,
    repeatability, or low metabolic strain under long-duration work.
  - It does not justify a taper protocol or a recommendation to use fluid, plasma-volume
    expansion, or dextran to preserve performance.
  - It does not establish that blood-volume changes are the only contributors to detraining-related
    performance changes.
  - It does not justify transferring the findings directly to women, older athletes,
    clinical populations, or athletes with different training backgrounds.
  - It does not provide evidence for fueling, intensity distribution, progression,
    or event-specific coaching prescriptions.
  important_limits:
  - The abstract describes a small sample of eight endurance-trained men.
  - The intervention and follow-up period involved 2–4 weeks of inactivity, so longer
    detraining periods are not directly addressed.
  - Outcomes were measured during laboratory-based upright cycling at 50–60% VO2max
    and were not assessed during an actual long-duration event.
  - The blood-volume manipulation used infusion of a 6% dextran solution in saline;
    this is not equivalent to ordinary hydration or a normal training intervention.
  - Only abstract-level material was provided, limiting assessment of the full methods,
    participant characteristics, statistical analyses, and study procedures.
  - The study examined cardiovascular responses and VO2max, not direct measures of
    durability, fatigue resistance, pacing, or recovery coherence.
  allowed_uses:
  - durability_rationale
  authority_limit: acceptable_for_explanation
