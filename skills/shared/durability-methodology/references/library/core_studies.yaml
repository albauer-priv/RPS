- id: dur_core_033
  source_kind: core
  authors: Viribay, A., Arribalzaga, S., Mielgo-Ayuso, J., Castañeda-Babarro, A.,
    Seco-Calvo, J., & Urdampilleta, A.
  year: 2020
  title: Effects of 120 g/h of Carbohydrates Intake during a Mountain Marathon on
    Exercise-Induced Muscle Damage in Elite Runners
  journal_or_outlet: Nutrients
  source_type: peer_reviewed
  study_type: rct
  reference_locator: https://pubmed.ncbi.nlm.nih.gov/32403259/
  verification_status: verified
  locator_source: pubmed
  topic_tags:
  - fueling
  - carbohydrate
  - gut_training
  - endurance
  question_or_focus: Abstract-level examination of whether consuming 120 g/h of carbohydrate
    during a mountain marathon, compared with 90 g/h and 60 g/h, affected internal
    exercise load and exercise-induced muscle-damage markers in elite runners.
  population_or_scope: Twenty male elite runners who had previously undertaken nutritional
    and gut training, competing in a mountain marathon with approximately 4000 m of
    cumulative slope.
  what_was_examined:
  - A randomized trial comparing carbohydrate intake of 120 g/h, 90 g/h, and 60 g/h
    during a mountain marathon.
  - Internal exercise load, calculated from rate of perceived exertion during and
    after the marathon.
  - 'Exercise-induced muscle-damage markers measured before the race and 24 hours
    afterward: creatine kinase, lactate dehydrogenase, glutamic oxaloacetic transaminase,
    urea, and creatinine.'
  core_concepts:
  - Carbohydrate intake during ultraendurance exercise.
  - Internal exercise load assessed using perceived exertion.
  - Exercise-induced muscle damage assessed with biochemical markers.
  - Nutritional and gut training preceding high carbohydrate intake.
  - Comparison of 120 g/h with 90 g/h and 60 g/h during a mountain marathon.
  important_findings:
  - 'Internal exercise load was significantly lower in the 120 g/h group than in the
    60 g/h and 90 g/h groups: 3805 ± 281 AU versus 4688 ± 705 AU and 4692 ± 716 AU,
    respectively; p = 0.019; η2p = 0.471.'
  - At 24 hours after the race, the 120 g/h group had significantly lower creatine
    kinase values than the 60 g/h and 90 g/h groups; p = 0.019; η2p = 0.373.
  - At 24 hours after the race, the 120 g/h group had significantly lower lactate
    dehydrogenase values than the 60 g/h and 90 g/h groups; p < 0.001; η2p = 0.615.
  - At 24 hours after the race, the 120 g/h group had significantly lower glutamic
    oxaloacetic transaminase values than the 60 g/h and 90 g/h groups; p = 0.003;
    η2p = 0.500.
  - The abstract reports a correlation between exercise-induced muscle damage and
    internal exercise load of R = 0.742; p < 0.001.
  - The abstract does not report significant differences for urea or creatinine in
    the provided material.
  practical_implications:
  - For RPS fueling discussions involving long-duration or ultraendurance events,
    the abstract supports considering high carbohydrate intake during exercise as
    a relevant factor associated with lower internal exercise load and selected post-race
    muscle-damage markers in this study context.
  - The abstract-supported findings may inform athlete education about the potential
    relevance of carbohydrate intake to perceived internal load and post-event recovery
    markers when the athlete and event context are comparable.
  - Because participants had previously undertaken nutritional and gut training, the
    study can support discussion of gut-training context when translating high carbohydrate-intake
    findings, but it does not establish a universal intake prescription.
  - The findings may provide applied translation for ultraendurance and brevet-related
    fueling conversations, while remaining bounded by the study's mountain-marathon
    running population and abstract-only evidence access.
  key_takeaways:
  - The abstract reports that the 120 g/h carbohydrate group had lower internal exercise
    load during the mountain marathon than both the 60 g/h and 90 g/h groups.
  - The abstract reports lower 24-hour creatine kinase, lactate dehydrogenase, and
    glutamic oxaloacetic transaminase values in the 120 g/h group than in the 60 g/h
    and 90 g/h groups.
  - The abstract reports a close correlation between exercise-induced muscle damage
    and internal exercise load.
  - The findings are specific to previously gut-trained male elite runners completing
    a mountain marathon.
  what_this_does_not_justify:
  - It does not justify treating 120 g/h as a universally optimal or required carbohydrate
    intake for all endurance athletes, events, or RPS users.
  - It does not establish that the same effects occur in cyclists, brevet riders,
    masters athletes, recreational athletes, or athletes without prior nutritional
    and gut training.
  - It does not justify claims about improved performance, because the provided abstract
    reports internal exercise load and muscle-damage-marker outcomes rather than a
    performance outcome.
  - It does not justify a causal claim that reduced exercise-induced muscle-damage
    markers necessarily produce faster functional recovery or better subsequent training
    readiness.
  - It does not justify conclusions about season planning, tapering, progression,
    or intensity distribution.
  - It does not justify conclusions about gastrointestinal tolerance, despite the
    participants' prior nutritional and gut training, because gastrointestinal outcomes
    are not reported in the provided abstract.
  - It does not justify conclusions about urea or creatinine because the provided
    abstract does not report their results.
  important_limits:
  - The source material is abstract-only; the full methods, participant characteristics,
    intervention implementation, adherence, statistical analysis, and complete outcome
    reporting are not available in the provided package.
  - The sample comprised only 20 male elite runners.
  - The event was a mountain marathon with approximately 4000 m of cumulative slope,
    so transfer to cycling, brevet, flatter events, or different ultraendurance formats
    is uncertain.
  - Participants had previously undertaken nutritional and gut training, limiting
    direct transfer to athletes who have not practiced high carbohydrate intake.
  - Outcomes were assessed during the event and 24 hours afterward; longer-term recovery,
    subsequent performance, and training continuity were not reported in the abstract.
  - The study compared three carbohydrate-intake groups, but the provided abstract
    does not establish whether intake was individually adjusted, how intake was delivered,
    or whether all other nutritional factors were controlled.
  - The study reports associations between carbohydrate intake, internal exercise
    load, and selected biomarkers; the abstract does not provide enough detail to
    determine the contribution of pacing, environmental conditions, training status,
    or other confounders.
  - The abstract reports lower creatine kinase, lactate dehydrogenase, and glutamic
    oxaloacetic transaminase values but does not provide their absolute group values
    in the supplied material.
  allowed_uses:
  - fueling_guidance
  - coaching_translation
