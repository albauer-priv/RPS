    - Use as abstract-supported rationale for understanding long-term insufficient
      training stimulus, detraining, and preservation of training-induced adaptations
      during reduced training periods.
    - Use to inform season- and phase-planning discussions about maintaining training
      intensity while reducing volume, with the limitation that the abstract does
      not establish an individualized prescription.
    - Use for athlete education about physiological and performance changes associated
      with insufficient training stimulus longer than 4 weeks.
