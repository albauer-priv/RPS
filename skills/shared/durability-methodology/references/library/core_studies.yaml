- id: dur_core_030
  source_kind: core
  authors: Jentjens, R. L. P. G., & Jeukendrup, A. E.
  year: 2005
  title: High rates of exogenous carbohydrate oxidation from a mixture of glucose
    and fructose ingested during prolonged cycling exercise
  journal_or_outlet: British Journal of Nutrition
  source_type: peer_reviewed
  study_type: other
  reference_locator: https://pubmed.ncbi.nlm.nih.gov/15946410/
  verification_status: verified
  locator_source: pubmed
  topic_tags:
  - fueling
  - carbohydrate
  - fructose_glucose
  - cyclists
  question_or_focus: Whether ingesting a high-rate mixture of glucose and fructose
    during prolonged cycling produces higher exogenous carbohydrate oxidation rates
    than ingesting glucose alone.
  population_or_scope: Eight trained male cyclists (VO2max 68 ± 1 ml/kg per min) cycling
    for 150 minutes at 50% of maximal power output (60 ± 1% VO2max) on three occasions
    while consuming water, 1.2 g/min glucose, or 1.2 g/min glucose plus 1.2 g/min
    fructose.
  what_was_examined:
  - Exogenous carbohydrate oxidation during 150 minutes of cycling exercise.
  - A glucose solution providing 1.2 g/min glucose compared with a solution providing
    1.2 g/min glucose plus 1.2 g/min fructose.
  - Peak exogenous carbohydrate oxidation rates and exogenous carbohydrate oxidation
    rates during the last 90 minutes of exercise.
  core_concepts:
  - Exogenous carbohydrate oxidation
  - Glucose and fructose ingestion
  - Prolonged cycling exercise
  - High-rate carbohydrate ingestion
  - Multiple-transportable carbohydrate context
  important_findings:
  - Eight trained male cyclists completed 150 minutes of cycling at 50% of maximal
    power output while consuming water, glucose, or glucose plus fructose.
  - 'Peak exogenous carbohydrate oxidation was higher in the glucose-plus-fructose
    trial than in the glucose trial: 1.75 (SE 0.11) g/min versus 1.06 (SE 0.05) g/min,
    with P<0.01.'
  - 'During the last 90 minutes of exercise, exogenous carbohydrate oxidation was
    approximately 50% higher with glucose plus fructose than with glucose: 1.49 (SE
    0.08) g/min versus 0.99 (SE 0.06) g/min, with P<0.05.'
  - The abstract states that the results demonstrate peak exogenous carbohydrate oxidation
    of approximately 1.75 g/min when glucose and fructose were ingested at 2.4 g/min
    during 150 minutes of cycling exercise.
  practical_implications:
  - The abstract supports using this study as fueling-specific scientific context
    for discussing how glucose-plus-fructose mixtures may affect exogenous carbohydrate
    oxidation during prolonged cycling.
  - For RPS athlete education or coach discussion, the findings can support an abstract-bounded
    explanation that carbohydrate type and combined glucose-fructose intake may influence
    the amount of ingested carbohydrate oxidized during long cycling exercise.
  - The findings may inform further consideration of carbohydrate formulation for
    prolonged endurance exercise, but the abstract alone does not establish an individualized
    fueling prescription.
  key_takeaways:
  - The abstract reports higher peak exogenous carbohydrate oxidation with glucose
    plus fructose than with glucose alone during prolonged cycling.
  - The abstract reports approximately 50% higher exogenous carbohydrate oxidation
    during the last 90 minutes with glucose plus fructose than with glucose alone.
  - At an intake rate of 2.4 g/min combined glucose and fructose, the abstract reports
    peak exogenous carbohydrate oxidation of approximately 1.75 g/min.
  what_this_does_not_justify:
  - It does not justify a universal recommendation to ingest 2.4 g/min of carbohydrate
    or any specific glucose-to-fructose ratio for all RPS athletes.
  - It does not justify claims about improved performance, pacing stability, durability,
    fatigue resistance, recovery, gastrointestinal tolerance, or health outcomes,
    because those outcomes are not reported in the abstract.
  - It does not justify conclusions about brevet or ultra events, masters athletes,
    female athletes, untrained athletes, or athletes with different physiological
    characteristics.
  - It does not justify treating exogenous carbohydrate oxidation as equivalent to
    performance benefit or reduced metabolic strain.
  - It does not justify direct coaching imperatives without considering the athlete,
    event duration, intensity, tolerance, and broader fueling plan.
  important_limits:
  - The source material is abstract-only; methods and results beyond the provided
    abstract cannot be independently evaluated here.
  - The study included only eight trained male cyclists.
  - The exercise protocol was 150 minutes at approximately 60% VO2max, which limits
    direct transfer to longer, more variable, or higher- or lower-intensity RPS events.
  - The abstract reports oxidation outcomes, not direct performance, pacing, durability,
    recovery, or gastrointestinal outcomes.
  - The abstract does not provide enough information to assess allocation, blinding,
    order effects, or the complete statistical and methodological context.
  - The findings concern a specific glucose-plus-fructose intake condition and should
    not be generalized to all carbohydrate mixtures or intake strategies.
