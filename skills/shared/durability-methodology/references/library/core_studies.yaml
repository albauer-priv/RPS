      background for understanding how a short period of inactivity may affect cardiovascular
      exercise responses in endurance-trained athletes. It supports a cautious durability
      rationale, but not direct evidence about long-duration cycling performance or
      coaching prescriptions.
    research_question_or_purpose: The study examined whether the decline in exercise
      stroke volume after a few weeks of detraining was associated with reduced blood
      volume, and whether expanding blood volume could restore cardiovascular function
      toward trained-state values.
    study_type: Peer-reviewed experimental study; the available source material is
      abstract-only.
    population_or_context: Eight endurance-trained men were assessed before and after
      2–4 weeks of inactivity during upright cycling at 50–60% VO2max. Blood volume
      was subsequently expanded with a 6% dextran solution in saline.
    what_was_actually_examined: The abstract reports measurements of blood volume,
      plasma volume, stroke volume, VO2max, heart rate, and total peripheral resistance.
      It also reports a blood-volume expansion condition used to assess whether cardiovascular
      responses in the detrained state could be restored toward trained-state values.
    core_concepts:
    - Detraining
    - Blood volume and plasma volume
    - Stroke volume
    - VO2max
    - Submaximal cardiovascular response
    - Ventricular filling
    key_takeaways:
    - The abstract reports a 9% decline in blood volume and a 12% decline in plasma
      volume after 2–4 weeks of inactivity.
    - The abstract reports lower stroke volume and VO2max, with higher heart rate
      and total peripheral resistance during submaximal upright exercise.
    - The abstract reports that blood-volume expansion restored stroke volume and
      VO2max to within 2–4% of trained values and brought heart rate and total peripheral
      resistance near trained values.
    - The abstract attributes the cardiovascular decline largely to reduced blood
      volume that appears to limit ventricular filling during upright exercise.
    important_findings:
    - Blood volume decreased from 5,177 to 4,692 ml, a 9% decline.
    - Plasma volume decreased by 12%.
    - Stroke volume decreased by 12% and VO2max by 6%.
    - Submaximal exercise heart rate increased by 11% and total peripheral resistance
      by 8%.
    - Following expansion to approximately 5,500 ± 200 ml, stroke volume and VO2max
      in the detrained state increased to within 2–4% of trained values.
    - Heart rate and total peripheral resistance during submaximal exercise were lowered
      to near trained values after volume expansion.
    practical_implications_for_rps:
    - The abstract can support explaining that short-term inactivity may influence
      cardiovascular exercise responses through changes in blood and plasma volume.
    - The abstract suggests that altered ventricular filling may be one mechanism
      relevant to post-detraining exercise response.
    - It should be used as physiological context rather than as a direct basis for
      prescribing training re-entry, hydration, tapering, or long-duration pacing
      strategies.
    what_this_source_does_not_justify:
    - It does not justify a specific taper, detraining, hydration, or plasma-volume-expansion
      protocol.
    - It does not directly establish effects on durability, fatigue resistance, pacing
      stability, brevet performance, ultra performance, or prolonged exercise.
    - It does not show that blood-volume reduction is the sole cause of all detraining-related
      performance changes.
    - It does not establish transferability to populations or settings not represented
      in the abstract.
    limits_and_transfer_boundaries:
    - The sample consisted of eight endurance-trained men.
    - The inactivity period was limited to 2–4 weeks.
    - The testing context was laboratory-based upright cycling at 50–60% VO2max rather
      than a long-duration cycling event.
    - Dextran infusion is an experimental blood-volume manipulation and should not
