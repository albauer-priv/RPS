    why_this_source_matters_for_rps: The source matters for RPS because it provides
      abstract-level evidence directly examining carbohydrate formulation during prolonged
      cycling, a relevant context for long-duration endurance fueling. Its contribution
      is limited to exogenous carbohydrate oxidation and should not be treated as
      evidence for durability, pacing, performance, or recovery outcomes.
    research_question_or_purpose: The abstract states that the study investigated
      whether ingesting a high-rate mixture of glucose and fructose at 2.4 g/min would
      produce higher exogenous carbohydrate oxidation rates than previously observed
      and higher than glucose alone.
    study_type: Abstract-level report of a controlled repeated-exercise cycling study;
      the supplied material does not provide enough methodological detail to classify
      it more specifically within the available study-type categories.
    population_or_context: Eight trained male cyclists with a reported VO2max of 68
      ± 1 ml/kg per min cycled for 150 minutes at 50% of maximal power output (60
      ± 1% VO2max) on three occasions. They consumed water, 1.2 g/min glucose, or
      1.2 g/min glucose plus 1.2 g/min fructose.
    what_was_actually_examined: The study examined exogenous carbohydrate oxidation
      during prolonged cycling under water, glucose, and glucose-plus-fructose intake
      conditions, including peak oxidation rates and rates during the last 90 minutes
      of exercise.
