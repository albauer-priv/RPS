    gastrointestinal, fluid-absorption, and sensory mechanisms.
  population_or_scope: Fourteen studies with estimates of 2.5–3.0-hour endurance performance,
    mostly in men and mostly in cycling. The abstract describes ingestion ratios of
    0.5:1–1.0:1 fructose:glucose or fructose:maltodextrin at carbohydrate ingestion
    rates of 1.3–2.4 g·min⁻¹, compared with isocaloric glucose or maltodextrin.
  what_was_examined:
  - The effect of fructose:glucose or fructose:maltodextrin composite beverages versus
    glucose or maltodextrin on endurance performance.
  - Performance estimates from 14 studies involving 2.5–3.0-hour endurance tasks,
    mostly in male cyclists.
  - Associations between performance effects and exogenous carbohydrate oxidation,
    fluid absorption, gastrointestinal distress, and sensory responses.
  - Different fructose:glucose ratios and carbohydrate ingestion rates.
  core_concepts:
  - Fructose–glucose or fructose–maltodextrin composite carbohydrate ingestion.
  - Exogenous carbohydrate oxidation.
  - Gastrointestinal comfort and distress.
  - Fluid absorption.
  - Endurance performance during approximately 2.5–3.0-hour exercise.
  - Carbohydrate dose and fructose:glucose ratio.
  important_findings:
  - Relative to isocaloric glucose or maltodextrin, ingestion of 0.5:1–1.0:1 fructose:glucose
    or fructose:maltodextrin beverages at 1.3–2.4 g carbohydrate·min⁻¹ was associated
    with small to moderate mean-power enhancements of 1–9%, with a 95% confidence
    interval of 0–19%.
  - For 0.5:1 composites, the abstract reports larger improvements at ingestion rates
    of at least 1.7 g·min⁻¹, namely 4–9% with a 95% confidence interval of 2–19%,
    than at 1.4–1.6 g·min⁻¹, namely 1–3% with a 95% confidence interval of 0–6%.
  - The abstract states that higher-ingestion-rate effects were associated with increased
    exogenous carbohydrate oxidation, unilateral fluid absorption, and lower gastrointestinal
    distress relative to control.
  - The abstract reports that 0.7:1–1.0:1 fructose:glucose solutions were absorbed
    fastest.
  - The abstract reports that, at 1.5–1.8 g·min⁻¹, a 0.8:1 fructose:glucose ratio
    conveyed the highest exogenous carbohydrate energy and endurance power compared
    with lower or higher ratios.
  practical_implications:
  - For RPS fueling education, the abstract supports explaining that mixed fructose–glucose
    or fructose–maltodextrin formulations may provide endurance-performance advantages
    over a single saccharide during approximately 2.5–3.0-hour exercise, particularly
    at the ingestion rates and ratios examined.
  - The abstract supports presenting carbohydrate amount and carbohydrate type together
    when discussing endurance fueling, because the reported effects varied with both
    ingestion rate and fructose:glucose ratio.
  - The abstract can inform individualized fueling discussions about gastrointestinal
    tolerance, exogenous carbohydrate availability, and the distinction between a
    composite formulation and a single-saccharide formulation.
  - The abstract does not establish a universal prescription; any RPS application
    should remain bounded by the reviewed exercise duration, study populations, tested
    products, ingestion rates, and individual tolerance.
  key_takeaways:
  - The abstract reports that composite fructose–glucose or fructose–maltodextrin
    beverages produced small to moderate endurance-power benefits relative to isocaloric
    glucose or maltodextrin in the reviewed studies.
  - The abstract describes the largest reported improvements with 0.5:1 composite
    beverages ingested at rates of at least 1.7 g carbohydrate·min⁻¹, compared with
    lower ingestion rates.
  - The abstract reports that 0.7:1–1.0:1 fructose:glucose solutions were absorbed
    fastest, and that a 0.8:1 ratio at 1.5–1.8 g·min⁻¹ was associated with the highest
    exogenous carbohydrate energy and endurance power among the ratios compared.
  - The review abstract concludes that 0.5:1–1.0:1 composite beverages at 1.3–2.4
    g·min⁻¹ likely benefit 2.5–3.0-hour endurance power versus a single saccharide.
  what_this_does_not_justify:
  - It does not justify claiming that composite carbohydrates improve durability,
    fatigue resistance, pacing stability, recovery, or repeatability as distinct outcomes;
    the abstract reports endurance-power findings rather than those RPS constructs.
  - It does not justify a universal carbohydrate target, fructose:glucose ratio, or
    product recommendation for every athlete or event.
  - It does not justify assuming that the reported findings apply unchanged to brevet
    or ultra-endurance events, because the abstract explicitly states that ultra-endurance
    exercise remains an area requiring further study.
  - It does not justify assuming that the findings apply to females, competition settings,
    heat stress, or other food formats, because the abstract identifies these as contexts
    requiring further research.
  - It does not justify inferring benefits at carbohydrate ingestion rates below 1.3
    g·min⁻¹.
  - It does not justify treating the reported associations with oxidation, fluid absorption,
    or gastrointestinal distress as proof that those mechanisms caused the performance
    differences.
  important_limits:
  - The source material is abstract-only; the review methods, study-level characteristics,
    risk of bias, and full analysis cannot be independently assessed from the provided
    material.
  - The 14 studies were mostly conducted in men and mostly in cycling.
