    - High-rate carbohydrate ingestion
    - Fueling formulation
    key_takeaways:
    - The abstract reports that glucose plus fructose produced higher exogenous carbohydrate
      oxidation than glucose alone.
    - The abstract reports approximately 50% higher oxidation during the last 90 minutes
      with glucose plus fructose than with glucose alone.
    - The abstract reports a peak exogenous carbohydrate oxidation rate of approximately
      1.75 g/min under the 2.4 g/min combined glucose-plus-fructose intake condition.
    important_findings:
    - Peak exogenous carbohydrate oxidation was 1.75 (SE 0.11) g/min with glucose
      plus fructose and 1.06 (SE 0.05) g/min with glucose alone; the abstract reports
      P<0.01.
    - During the last 90 minutes, exogenous carbohydrate oxidation was 1.49 (SE 0.08)
      g/min with glucose plus fructose and 0.99 (SE 0.06) g/min with glucose alone;
      the abstract reports P<0.05.
    - The abstract describes the exercise protocol as 150 minutes of cycling at 50%
      of maximal power output, corresponding to 60 ± 1% VO2max.
    practical_implications_for_rps:
    - The abstract supports discussing glucose-plus-fructose mixtures as a fueling
      formulation associated with higher exogenous carbohydrate oxidation than glucose
      alone under the tested cycling conditions.
