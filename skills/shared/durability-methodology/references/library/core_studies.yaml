- id: dur_core_007
  source_kind: core
  authors: Barsumyan, A., Soost, C., Shyla, R., Graw, J. A., Bliemel, C., & Burchard,
    R.
  year: 2025
  title: Durability as an independent parameter of endurance performance in cycling
  journal_or_outlet: BMC Sports Science, Medicine and Rehabilitation
  source_type: peer_reviewed
  study_type: peer_reviewed
  reference_locator: https://doi.org/10.1186/s13102-025-01238-8
  verification_status: verified
  locator_source: doi
  topic_tags:
  - durability
  - fatigue_resistance
  - repeatability
  question_or_focus: Assess durability as an independent parameter of endurance performance
    in cycling.
  population_or_scope: Cycling-focused peer-reviewed source; most useful as concept
    reinforcement and field-performance interpretation.
  what_was_examined: []
  core_concepts:
  - Durability can stand as its own parameter rather than collapsing into threshold
    or VO2 style markers.
  - Cycling performance under prolonged load has explanatory dimensions beyond fresh
    physiology.
  - Independent-parameter framing strengthens the profiling case for late-session
    assessment.
  important_findings:
  - Adds peer-reviewed support to the argument that durability deserves its own place
    in performance analysis.
  - Improves confidence that late-session decline is not merely noise around fresh-performance
    metrics.
  - Strengthens the rationale for looking at long-duration execution as a real planning
    signal.
  practical_implications:
  - In RPS, this supports using durability-oriented language and analysis without
    pretending that FTP or threshold alone is sufficient.
  - Useful when defending why long aerobic execution and finish quality remain central
    in ultra/brevet contexts.
  - Best used as conceptual support, not as a strict numeric source.
  key_takeaways:
  - Reinforces durability as separable from other performance dimensions.
  - Supports independent profiling of fatigue resistance.
  - Helps justify durability-specific evaluation.
  what_this_does_not_justify: []
  important_limits:
  - Use as support for concept separation, not governance.
  - Do not infer exact planning dosage from the paper title-level contribution alone.
