      ratio, or a requirement to use glucose plus fructose.
    - The source does not justify claims that the mixture improves performance, pacing,
      durability, fatigue resistance, recovery, or gastrointestinal outcomes.
    - The source does not justify direct transfer to ultra-distance or brevet events,
      masters athletes, women, untrained athletes, or other populations not represented
      in the abstract.
    - The source does not justify equating higher exogenous carbohydrate oxidation
      with better overall fueling effectiveness.
    limits_and_transfer_boundaries:
    - Only abstract-level material was supplied, so full methods, participant characteristics,
      protocol details, and outcome interpretation cannot be assessed here.
